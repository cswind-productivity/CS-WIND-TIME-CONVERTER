<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>씨에스윈드 글로벌 공장 시간대</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start:       #0a0f1e;
            --bg-end:         #0f2444;
            --card-bg:        rgba(255, 255, 255, 0.055);
            --card-border:    rgba(255, 255, 255, 0.10);
            --card-hover-bg:  rgba(255, 255, 255, 0.09);
            --card-selected:  rgba(99, 179, 237, 0.25);
            --accent-blue:    #63b3ed;
            --accent-indigo:  #818cf8;
            --accent-green:   #34d399;
            --accent-yellow:  #fbbf24;
            --accent-red:     #f87171;
            --text-primary:   #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:     #64748b;
            --input-bg:       rgba(255, 255, 255, 0.07);
            --input-border:   rgba(255, 255, 255, 0.14);
            --input-focus:    rgba(99, 179, 237, 0.5);
            --timeline-line:  rgba(255, 255, 255, 0.15);
            --shadow-card:    0 8px 32px rgba(0, 0, 0, 0.45);
            --radius-card:    16px;
            --radius-sm:      10px;
            --transition:     all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 1.25rem;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* 배경 장식 원 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99,179,237,0.07) 0%, transparent 70%);
            top: -150px; right: -100px;
        }
        body::after {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(129,140,248,0.07) 0%, transparent 70%);
            bottom: -100px; left: -100px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── 글래스 카드 공통 ── */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
        }

        /* ── 헤더 ── */
        .header-card {
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(99,179,237,0.35);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            color: white;
        }

        .brand-text h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* DST 뱃지 영역 */
        .dst-status-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dst-label-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-right: 0.25rem;
        }

        .dst-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            white-space: nowrap;
            letter-spacing: 0.02em;
            transition: var(--transition);
        }

        .dst-badge.active {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.35);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.15);
        }

        .dst-badge.inactive {
            background: rgba(100, 116, 139, 0.15);
            color: var(--text-muted);
            border: 1px solid rgba(100, 116, 139, 0.25);
        }

        /* 컨트롤 영역 */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.875rem;
            margin-bottom: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .control-label {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .control-input {
            padding: 0.6rem 0.875rem;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            -webkit-appearance: none;
        }

        .control-input:focus {
            border-color: var(--accent-blue);
            background: rgba(99, 179, 237, 0.08);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .control-input option {
            background: #1e293b;
            color: var(--text-primary);
        }

        /* 인포 박스 */
        .info-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(99, 179, 237, 0.08);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.875rem;
            font-size: 0.75rem;
            color: var(--accent-blue);
        }

        .info-bar svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        /* ── 공장 카드 그리드 ── */
        .factories-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .factory-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 1rem 1.1rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        /* 상단 accent 라인 */
        .factory-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, rgba(99,179,237,0.3), transparent);
            border-radius: var(--radius-card) var(--radius-card) 0 0;
            opacity: 0;
            transition: var(--transition);
        }

        .factory-card.working::before {
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
            opacity: 1;
        }

        .factory-card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        .factory-card.selected {
            background: var(--card-selected);
            border-color: rgba(99, 179, 237, 0.5);
            box-shadow: 0 0 0 1px rgba(99,179,237,0.4), 0 12px 40px rgba(99,179,237,0.2);
        }

        .factory-card.selected::before {
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 1;
        }

        .factory-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .factory-info { flex: 1; }

        .factory-name {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.2rem;
        }

        .factory-flag { font-size: 1.2rem; line-height: 1; }

        .factory-code {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .factory-location {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 1.6rem;
        }

        .factory-meta {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.35rem;
            margin-left: 1.6rem;
            flex-wrap: wrap;
        }

        .status-badge {
            font-size: 0.62rem;
            font-weight: 700;
            padding: 0.18rem 0.55rem;
            border-radius: 9999px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-work {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .status-off {
            background: rgba(100, 116, 139, 0.15);
            color: var(--text-muted);
            border: 1px solid rgba(100, 116, 139, 0.2);
        }

        .dst-card-tag {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.18rem 0.5rem;
            border-radius: 9999px;
            letter-spacing: 0.03em;
            white-space: nowrap;
            background: rgba(251, 191, 36, 0.12);
            color: var(--accent-yellow);
            border: 1px solid rgba(251, 191, 36, 0.28);
        }

        .factory-time { margin-top: 0.5rem; }

        .time-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-indigo) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .factory-card.selected .time-display {
            background: linear-gradient(135deg, #93c5fd 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .date-display {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.4rem;
        }

        .day-of-week {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .date-text {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .tz-offset {
            font-size: 0.62rem;
            color: var(--text-muted);
            font-family: 'Roboto Mono', monospace;
            margin-left: auto;
        }

        /* ── 타임라인 ── */
        .timeline-container {
            padding: 1.5rem 1.5rem 1.25rem;
        }

        .timeline-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .timeline-header h2 {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .timeline-header-line {
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }

        .timeline-wrapper {
            position: relative;
            padding: 56px 24px 72px;
        }

        /* ── 서명 ── */
        .signature {
            position: fixed;
            bottom: 22px;
            right: 28px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            color: rgba(148, 163, 184, 0.5);
            z-index: 1000;
            pointer-events: none;
            letter-spacing: 0.02em;
        }

        /* ── 반응형 ── */
        @media (max-width: 1200px) {
            .factories-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .controls { grid-template-columns: repeat(2, 1fr); }
            .factories-grid { grid-template-columns: repeat(2, 1fr); }
            .dst-status-area { flex-wrap: wrap; }
        }
        @media (max-width: 600px) {
            body { padding: 0.75rem; }
            .controls { grid-template-columns: 1fr; }
            .factories-grid { grid-template-columns: 1fr; }
            .header-top { flex-direction: column; align-items: flex-start; }
            .time-display { font-size: 1.75rem; }
        }

        /* ── 스크롤바 ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ── input date/time 다크모드 커서색 ── */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ── 헤더 카드 ── -->
    <div class="header-card glass-card">
        <div class="header-top">
            <!-- 브랜드 -->
            <div class="header-brand">
                <div class="brand-icon">
                    <!-- 풍력 터빈 SVG -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="12" x2="12" y2="22"/>
                        <path d="M12 12 C12 12 6 8 4 3 C7 4 10 8 12 12Z" fill="currentColor" stroke="none" opacity="0.9"/>
                        <path d="M12 12 C12 12 18 8 20 3 C17 4 14 8 12 12Z" fill="currentColor" stroke="none" opacity="0.7"/>
                        <path d="M12 12 C12 12 7 16 3 17 C5 14 9 13 12 12Z" fill="currentColor" stroke="none" opacity="0.8"/>
                        <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>CS Wind Global Time</h1>
                    <p>Global Factory Time Converter</p>
                </div>
            </div>

            <!-- DST 상태 뱃지 -->
            <div class="dst-status-area">
                <span class="dst-label-text">DST Auto</span>
                <span id="dstBadgeUS" class="dst-badge inactive">🇺🇸 표준시</span>
                <span id="dstBadgeEU" class="dst-badge inactive">🇪🇺 표준시</span>
            </div>
        </div>

        <!-- 컨트롤 -->
        <div class="controls">
            <div class="control-group">
                <label class="control-label">기준 지점</label>
                <select id="baseLocation" class="control-input">
                    <option value="CSHQ">🇰🇷 CSHQ — 한국</option>
                    <option value="CSVN">🇻🇳 CSVN — 베트남</option>
                    <option value="CSCN">🇨🇳 CSCN — 중국</option>
                    <option value="CSTW">🇹🇼 CSTW — 대만</option>
                    <option value="CSTR">🇹🇷 CSTR — 터키</option>
                    <option value="CSPT">🇵🇹 CSPT — 포르투갈</option>
                    <option value="CSAM">🇺🇸 CSAM — 미국</option>
                    <option value="CSWO">🇩🇰 CSWO — 덴마크</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label">날짜 선택</label>
                <input type="date" id="selectedDate" class="control-input">
            </div>
            <div class="control-group">
                <label class="control-label">시간 입력</label>
                <input type="time" id="selectedTime" class="control-input">
            </div>
        </div>

        <!-- 인포 바 -->
        <div id="infoBox" class="info-bar">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>현재 시각이 표시되고 있습니다. 날짜와 시간을 입력하면 시간 변환 모드로 전환됩니다.</span>
        </div>
    </div>

    <!-- ── 공장 카드 그리드 ── -->
    <div id="factoriesGrid" class="factories-grid"></div>

    <!-- ── 타임라인 ── -->
    <div class="timeline-container glass-card">
        <div class="timeline-header">
            <h2>Timeline Overview</h2>
            <div class="timeline-header-line"></div>
        </div>
        <div class="timeline-wrapper">
            <div id="timelineContent"></div>
        </div>
    </div>

</div>

<div class="signature">Made by SJ Lee</div>

<script>
    // ── 공장 데이터 ──
    const factories = [
        { id:'cshq', name:'CSHQ', shortName:'KR', location:'한국',    timezone:'Asia/Seoul',           flag:'🇰🇷', hasDST:false, workStart:'09:00', workEnd:'18:00', color:'#63b3ed' },
        { id:'csvn', name:'CSVN', shortName:'VN', location:'베트남',  timezone:'Asia/Ho_Chi_Minh',     flag:'🇻🇳', hasDST:false, workStart:'07:30', workEnd:'17:30', color:'#f87171' },
        { id:'cscn', name:'CSCN', shortName:'CN', location:'중국',    timezone:'Asia/Shanghai',        flag:'🇨🇳', hasDST:false, workStart:'07:30', workEnd:'17:30', color:'#fbbf24' },
        { id:'cstw', name:'CSTW', shortName:'TW', location:'대만',    timezone:'Asia/Taipei',          flag:'🇹🇼', hasDST:false, workStart:'08:00', workEnd:'17:00', color:'#34d399' },
        { id:'cstr', name:'CSTR', shortName:'TR', location:'터키',    timezone:'Europe/Istanbul',      flag:'🇹🇷', hasDST:false, workStart:'07:30', workEnd:'17:30', color:'#fb923c' },
        { id:'cspt', name:'CSPT', shortName:'PT', location:'포르투갈',timezone:'Europe/Lisbon',        flag:'🇵🇹', hasDST:true,  dstRegion:'EU', workStart:'07:30', workEnd:'17:30', color:'#a78bfa' },
        { id:'csam', name:'CSAM', shortName:'US', location:'미국',    timezone:'America/Denver',       flag:'🇺🇸', hasDST:true,  dstRegion:'US', workStart:'07:30', workEnd:'16:30', color:'#818cf8' },
        { id:'cswo', name:'CSWO', shortName:'DK', location:'덴마크',  timezone:'Europe/Copenhagen',    flag:'🇩🇰', hasDST:true,  dstRegion:'EU', workStart:'07:30', workEnd:'15:30', color:'#e879f9' }
    ];

    let selectedBase = 'CSHQ';
    let selectedTime = '';
    let selectedDate = '';

    // ────────────────────────────────────────────────
    // DST 자동 판별
    // ────────────────────────────────────────────────
    function getNthWeekday(year, month, nth, dow) {
        if (nth > 0) {
            const first = new Date(Date.UTC(year, month, 1));
            let offset = dow - first.getUTCDay();
            if (offset < 0) offset += 7;
            return new Date(Date.UTC(year, month, 1 + offset + (nth - 1) * 7));
        } else {
            const last = new Date(Date.UTC(year, month + 1, 0));
            let offset = last.getUTCDay() - dow;
            if (offset < 0) offset += 7;
            return new Date(Date.UTC(year, month, last.getUTCDate() - offset));
        }
    }

    function isUSDST(date) {
        const y = date.getUTCFullYear();
        return date >= getNthWeekday(y, 2, 2, 0) && date < getNthWeekday(y, 10, 1, 0);
    }

    function isEUDST(date) {
        const y = date.getUTCFullYear();
        return date >= getNthWeekday(y, 2, -1, 0) && date < getNthWeekday(y, 9, -1, 0);
    }

    function isDSTActive(factory, refDate) {
        if (!factory.hasDST) return false;
        if (factory.dstRegion === 'US') return isUSDST(refDate);
        if (factory.dstRegion === 'EU') return isEUDST(refDate);
        return false;
    }

    // ────────────────────────────────────────────────
    // DST 뱃지 업데이트
    // ────────────────────────────────────────────────
    function updateDSTBadges(refDate) {
        const usActive = isUSDST(refDate);
        const euActive = isEUDST(refDate);
        const bUS = document.getElementById('dstBadgeUS');
        const bEU = document.getElementById('dstBadgeEU');
        bUS.textContent = usActive ? '🇺🇸 써머타임' : '🇺🇸 표준시';
        bUS.className   = 'dst-badge ' + (usActive ? 'active' : 'inactive');
        bEU.textContent = euActive ? '🇪🇺 써머타임' : '🇪🇺 표준시';
        bEU.className   = 'dst-badge ' + (euActive ? 'active' : 'inactive');
    }

    // ────────────────────────────────────────────────
    // UTC Offset 표시 문자열
    // ────────────────────────────────────────────────
    function formatOffset(minutes) {
        const sign = minutes >= 0 ? '+' : '-';
        const abs  = Math.abs(minutes);
        const h    = String(Math.floor(abs / 60)).padStart(2, '0');
        const m    = String(abs % 60).padStart(2, '0');
        return `UTC${sign}${h}:${m}`;
    }

    // ────────────────────────────────────────────────
    // 초기화
    // ────────────────────────────────────────────────
    function init() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('selectedDate').value = today;
        selectedDate = today;

        document.getElementById('baseLocation').addEventListener('change', e => { selectedBase = e.target.value; updateDisplay(); });
        document.getElementById('selectedDate').addEventListener('change', e => { selectedDate = e.target.value; updateDisplay(); });
        document.getElementById('selectedTime').addEventListener('change', e => { selectedTime = e.target.value; updateDisplay(); });

        updateDisplay();
        setInterval(updateDisplay, 60000);
    }

    // ────────────────────────────────────────────────
    // 근무 시간 판별
    // ────────────────────────────────────────────────
    function getWorkingStatus(timeStr, dayOfWeek, factory) {
        if (!timeStr || !dayOfWeek) return 'off';
        if (dayOfWeek === '토' || dayOfWeek === '일') return 'off';
        const [h, m]    = timeStr.split(':').map(Number);
        const [sh, sm]  = factory.workStart.split(':').map(Number);
        const [eh, em]  = factory.workEnd.split(':').map(Number);
        const t = h*60+m, s = sh*60+sm, e = eh*60+em;
        return (t >= s && t < e) ? 'work' : 'off';
    }

    // ────────────────────────────────────────────────
    // 디스플레이 전체 업데이트
    // ────────────────────────────────────────────────
    function updateDisplay() {
        const grid = document.getElementById('factoriesGrid');
        grid.innerHTML = '';

        let refDate = new Date();
        if (selectedDate) refDate = new Date(selectedDate + 'T12:00:00Z');
        updateDSTBadges(refDate);

        const factoryTimes = [];

        factories.forEach(factory => {
            const displayData = (selectedTime && selectedDate)
                ? getConvertedTime(factory)
                : getCurrentTime(factory);

            factoryTimes.push({ factory, ...displayData });

            const status    = getWorkingStatus(displayData.time, displayData.dayOfWeek, factory);
            const isSelected = factory.name === selectedBase;
            const dstActive  = isDSTActive(factory, refDate);
            const offset     = formatOffset(displayData.offsetMin ?? 0);

            const dstTagHTML = (factory.hasDST && dstActive)
                ? `<span class="dst-card-tag">☀️ DST</span>`
                : '';

            const card = document.createElement('div');
            card.className = `factory-card${isSelected ? ' selected' : ''}${status === 'work' ? ' working' : ''}`;
            card.innerHTML = `
                <div class="factory-header">
                    <div class="factory-info">
                        <div class="factory-name">
                            <span class="factory-flag">${factory.flag}</span>
                            <span class="factory-code">${factory.name}</span>
                        </div>
                        <div class="factory-location">${factory.location}</div>
                        <div class="factory-meta">
                            <span class="status-badge status-${status}">${status === 'work' ? '● 근무 중' : '○ 근무 외'}</span>
                            ${dstTagHTML}
                        </div>
                    </div>
                </div>
                <div class="factory-time">
                    <div class="time-display">${displayData.time}</div>
                    <div class="date-display">
                        <span class="day-of-week">${displayData.dayOfWeek}</span>
                        <span class="date-text">${displayData.date}</span>
                        <span class="tz-offset">${offset}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        updateTimeline(factoryTimes);
    }

    // ────────────────────────────────────────────────
    // 현재 시각 (toLocaleString → DST 자동 반영)
    // ────────────────────────────────────────────────
    function getCurrentTime(factory) {
        const now = new Date();
        const timeStr   = now.toLocaleString('en-US', { timeZone: factory.timezone, hour:'2-digit', minute:'2-digit', hour12:false });
        const dayOfWeek = now.toLocaleDateString('ko-KR', { weekday:'short', timeZone: factory.timezone });
        const dateStr   = now.toLocaleDateString('ko-KR', { month:'short', day:'numeric', timeZone: factory.timezone });
        const offsetMin = getTimezoneOffset(now, factory.timezone);
        return { time: timeStr, dayOfWeek, date: dateStr, offsetMin };
    }

    // ────────────────────────────────────────────────
    // Timezone Offset 계산 (DST 자동 포함)
    // ────────────────────────────────────────────────
    function getTimezoneOffset(date, timezone) {
        const utcDate = new Date(date.toLocaleString('en-US', { timeZone:'UTC' }));
        const tzDate  = new Date(date.toLocaleString('en-US', { timeZone: timezone }));
        return Math.round((tzDate - utcDate) / 60000);
    }

    // ────────────────────────────────────────────────
    // 시간 변환 (선택 날짜+시간 기준)
    // ────────────────────────────────────────────────
    function getConvertedTime(factory) {
        const baseFactory = factories.find(f => f.name === selectedBase);
        const [h, m]      = selectedTime.split(':').map(Number);
        const testDate    = new Date(selectedDate + 'T12:00:00Z');

        const baseOffset   = getTimezoneOffset(testDate, baseFactory.timezone);
        const targetOffset = getTimezoneOffset(testDate, factory.timezone);

        let targetMin = (h * 60 + m) - baseOffset + targetOffset;
        let dayOffset = 0;
        if (targetMin < 0)         { targetMin += 1440; dayOffset = -1; }
        else if (targetMin >= 1440){ targetMin -= 1440; dayOffset =  1; }

        const timeStr    = String(Math.floor(targetMin/60)).padStart(2,'0') + ':' + String(targetMin%60).padStart(2,'0');
        const targetDate = new Date(testDate.getTime() + dayOffset * 86400000);
        const dayOfWeek  = targetDate.toLocaleDateString('ko-KR', { weekday:'short', timeZone:'UTC' });
        const dateStr    = targetDate.toLocaleDateString('ko-KR', { month:'short', day:'numeric', timeZone:'UTC' });

        return { time: timeStr, dayOfWeek, date: dateStr, offsetMin: targetOffset };
    }

    // ────────────────────────────────────────────────
    // 타임라인
    // ────────────────────────────────────────────────
    function updateTimeline(factoryTimes) {
        const tc = document.getElementById('timelineContent');

        const kr = factoryTimes.find(i => i.factory.id === 'cshq');
        const [kH, kM] = kr.time.split(':').map(Number);
        const kTot = kH * 60 + kM;
        const krPos = 85;

        const dayMap = { '월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0 };

        const positions = factoryTimes.map(item => {
            const [h, m] = item.time.split(':').map(Number);
            const tot    = h*60+m;
            const kDN    = dayMap[kr.dayOfWeek];
            const fDN    = dayMap[item.dayOfWeek];
            let dDay = 0;
            if (fDN !== kDN) {
                if ((fDN+1)%7 === kDN)       dDay = -1;
                else if ((kDN+1)%7 === fDN)  dDay =  1;
                else if (Math.abs(fDN-kDN)>3) dDay = fDN < kDN ? -1 : 1;
            }
            const diff   = tot - kTot + dDay*1440;
            const pos    = krPos + (diff/60)*5;
            return { ...item, pos, diff };
        });

        // ── 색상 헬퍼
        const col = (id) => {
            const f = factories.find(x => x.id === id);
            return f ? f.color : '#63b3ed';
        };

        let html = '';

        // 상단 — 국가 레이블 (CN/TW 제외)
        html += `<div style="position:absolute;top:0;left:24px;right:24px;height:28px;">`;
        positions.forEach(item => {
            if (item.factory.id==='cstw'||item.factory.id==='cscn') return;
            if (item.pos < -5 || item.pos > 107) return;
            html += `
                <div style="position:absolute;left:${item.pos}%;transform:translateX(-50%);">
                    <div style="font-size:0.78rem;font-weight:700;padding:3px 10px;border-radius:6px;
                                background:${col(item.factory.id)}22;color:${col(item.factory.id)};
                                border:1px solid ${col(item.factory.id)}55;
                                box-shadow:0 2px 8px ${col(item.factory.id)}22;
                                white-space:nowrap;text-align:center;letter-spacing:0.04em;">
                        ${item.factory.shortName}
                    </div>
                </div>`;
        });
        html += `</div>`;

        // 상단 — 시간 표시
        html += `<div style="position:absolute;top:34px;left:24px;right:24px;height:52px;">`;
        positions.forEach(item => {
            if (item.factory.id==='cstw'||item.factory.id==='cscn') return;
            if (item.pos < -5 || item.pos > 107) return;
            const [hh, mm] = item.time.split(':');
            html += `
                <div style="position:absolute;left:${item.pos}%;transform:translateX(-50%);text-align:center;">
                    <div style="font-family:'Roboto Mono',monospace;font-size:0.82rem;font-weight:700;
                                color:${col(item.factory.id)};white-space:nowrap;letter-spacing:-0.01em;">
                        ${hh}:${mm}
                    </div>
                    <div style="font-size:0.62rem;color:var(--text-muted);margin-top:2px;">
                        ${item.dayOfWeek}
                    </div>
                </div>`;
        });
        html += `</div>`;

        // 타임라인 라인
        html += `
            <div style="position:relative;margin-top:18px;">
                <div style="height:2px;background:linear-gradient(90deg,transparent,rgba(99,179,237,0.35) 10%,rgba(99,179,237,0.35) 90%,transparent);border-radius:2px;"></div>
                <!-- KR 기준 수직선 -->
                <div style="position:absolute;top:-10px;left:${krPos}%;transform:translateX(-50%);
                            width:2px;height:22px;background:var(--accent-blue);border-radius:2px;
                            box-shadow:0 0 8px var(--accent-blue);"></div>
            </div>`;

        // 눈금 시간
        const kMinOffset = (kM/60)*5;
        html += `<div style="position:relative;margin-top:0;"><div style="position:relative;height:48px;">`;
        for (let off = -18; off <= 2; off++) {
            const pos = krPos + off*5 - kMinOffset;
            if (pos < 0 || pos > 100) continue;
            let dH = kH + off;
            while (dH < 0) dH += 24;
            while (dH >= 24) dH -= 24;
            const isMajor = dH % 6 === 0;
            html += `
                <div style="position:absolute;left:${pos}%;transform:translateX(-50%);opacity:${isMajor?0.5:0.2};">
                    <div style="width:${isMajor?2:1}px;height:${isMajor?10:6}px;background:#94a3b8;margin:0 auto;"></div>
                    <div style="font-size:0.58rem;color:#94a3b8;text-align:center;white-space:nowrap;margin-top:4px;
                                font-family:'Roboto Mono',monospace;">
                        ${String(dH).padStart(2,'0')}:00
                    </div>
                </div>`;
        }
        html += `</div></div>`;

        // CN/TW 아래 표시
        html += `<div style="position:relative;margin-top:6px;">`;
        const cnData = positions.find(i => i.factory.id === 'cscn');
        if (cnData && cnData.pos >= -5 && cnData.pos <= 107) {
            const [hh, mm] = cnData.time.split(':');
            html += `
                <div style="position:absolute;left:${cnData.pos}%;transform:translateX(-50%);text-align:center;">
                    <div style="font-family:'Roboto Mono',monospace;font-size:0.82rem;font-weight:700;
                                color:${col('cscn')};white-space:nowrap;margin-bottom:3px;">${hh}:${mm}</div>
                    <div style="font-size:0.62rem;color:var(--text-muted);margin-bottom:4px;">${cnData.dayOfWeek}</div>
                    <div style="font-size:0.75rem;font-weight:700;padding:3px 10px;border-radius:6px;
                                background:${col('cscn')}22;color:${col('cscn')};
                                border:1px solid ${col('cscn')}55;
                                white-space:nowrap;text-align:center;letter-spacing:0.04em;">CN/TW</div>
                </div>`;
        }
        html += `</div>`;

        tc.innerHTML = html;
    }

    init();
</script>
</body>
</html>
